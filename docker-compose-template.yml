services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    command: --default-authentication-plugin=mysql_native_password
    ports: 
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql

  spider:
    build: .
    depends_on:
      - db

volumes:
  db-data:
